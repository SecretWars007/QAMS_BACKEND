name: Deploy QAMS Backend to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build, Test & Trigger Render Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Código
        uses: actions/checkout@v4

      - name: Configurar .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar Dependencias
        run: dotnet restore QAMS.sln

      - name: Compilar Solución (Release)
        run: dotnet build QAMS.sln --configuration Release --no-restore

      - name: Ejecutar Pruebas Unitarias
        run: dotnet test QAMS.sln --configuration Release --no-build --verbosity normal

      - name: Disparar Despliegue en Render (Deploy Hook)
        if: success()
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            echo "Disparando webhook de despliegue en Render..."
            curl -s -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
            echo "Despliegue activado con éxito en Render."
          else
            echo "Secreto RENDER_BACKEND_DEPLOY_HOOK no configurado. Omitiendo trigger."
          fi
