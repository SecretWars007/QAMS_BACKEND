# c:\diplomado\QAMS\render.yaml
databases:
  - name: qams-db
    databaseName: qams_db
    user: qams_user
    plan: free

services:
  - type: web
    name: qams-api
    env: docker
    plan: free
    dockerContext: .
    dockerfilePath: Dockerfile
    healthCheckPath: /swagger
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: FRONTEND_URL
        value: https://qams-web.onrender.com
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: qams-db
          property: connectionString
      - key: JwtSettings__Secret
        generateValue: true
      - key: JwtSettings__Issuer
        value: QAMS.Api
      - key: JwtSettings__Audience
        value: QAMS.Client
      - key: JwtSettings__AccessTokenExpirationMinutes
        value: "60"
      - key: JwtSettings__RefreshTokenExpirationDays
        value: "7"
